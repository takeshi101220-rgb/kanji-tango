<!doctype html>
<html lang="ja">
<head>
<title>漢字読み方単語帳</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap">
<style>
/* Layout: one centered column. Unit picker grid first, then a single large card per word group; reading is revealed under each kanji line. */
:root{
  --bg:#eef1f5; --surface:#fbfcfd; --ink:#1b2233; --muted:#5d667a; --line:#d3d9e3;
  --accent:#2c3e7a; --accent-ink:#ffffff; --warm:#c8542b; --ok:#2f7d5b;
  --kanji:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --ui:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131826; --surface:#1c2336; --ink:#e8ecf5; --muted:#98a2b8; --line:#2d3650;
  --accent:#8fa6f0; --accent-ink:#10162a; --warm:#f08a63; --ok:#6cc79c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131826; --surface:#1c2336; --ink:#e8ecf5; --muted:#98a2b8; --line:#2d3650;
  --accent:#8fa6f0; --accent-ink:#10162a; --warm:#f08a63; --ok:#6cc79c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1{font-family:var(--kanji);font-size:1.75rem;margin:0;text-wrap:balance;letter-spacing:.04em}
.sub{color:var(--muted);margin:0;font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;text-align:left;
  display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .15s}
.unit:hover{border-color:var(--accent)}
.unit .n{font-family:var(--kanji);font-size:2rem;font-weight:700;line-height:1.1;color:var(--accent)}
.unit .l{font-size:.8rem;color:var(--muted);letter-spacing:.08em}
.unit .c{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.unit.fin .n{color:var(--ok)}
.unit.fin .c{color:var(--ok)}
.reset{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;color:var(--muted);font-size:.85rem}
.reset.arm{border-color:var(--warm);color:var(--warm)}
.opt{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.95rem}
.opt input{width:20px;height:20px;accent-color:var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;color:var(--muted)}
.back:hover{border-color:var(--accent);color:var(--ink)}
.count{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:32px 20px;min-height:280px;
  display:flex;flex-direction:column;justify-content:center;gap:26px;cursor:pointer;text-align:center}
.w{display:flex;flex-direction:column;gap:4px;min-width:0}
.k{font-family:var(--kanji);font-weight:700;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.3;overflow-wrap:anywhere}
.r{font-size:1.3rem;color:var(--warm);font-weight:700;min-height:1.9em;overflow-wrap:anywhere;visibility:hidden}
.card.open .r{visibility:visible}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.card.open .hint{visibility:hidden}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:14px;font-weight:700}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);grid-column:1/-1}
.btn.again{color:var(--warm);border-color:var(--warm)}
.btn.good{color:var(--ok);border-color:var(--ok)}
.btn:hover{filter:brightness(1.07)}
.done{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:32px 20px;text-align:center;display:flex;flex-direction:column;gap:16px}
.done b{font-family:var(--kanji);font-size:2.4rem;color:var(--accent);font-variant-numeric:tabular-nums}
.done .row{display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA={"11":[{"k":["送ります"],"r":["おくります"]},{"k":["切ります","切手"],"r":["きります","きって"]},{"k":["貸します"],"r":["かします"]},{"k":["借ります"],"r":["かります"]},{"k":["旅行"],"r":["りょこう"]},{"k":["お金"],"r":["おかね"]},{"k":["教えます"],"r":["おしえます"]},{"k":["習います"],"r":["ならいます"]},{"k":["勉強します"],"r":["べんきょうします"]},{"k":["花"],"r":["はな"]},{"k":["外国"],"r":["がいこく"]}],"12":[{"k":["歩いて","行きます"],"r":["あるいて","いきます"]},{"k":["待ちます"],"r":["まちます"]},{"k":["立ちます"],"r":["たちます"]},{"k":["止めます"],"r":["とめます"]},{"k":["雨"],"r":["あめ"]},{"k":["入ります"],"r":["はいります"]},{"k":["出ます"],"r":["でます"]},{"k":["売ります"],"r":["うります"]},{"k":["使います"],"r":["つかいます"]},{"k":["作ります"],"r":["つくります"]}],"13":[{"k":["明るい","暗い"],"r":["あかるい","くらい"]},{"k":["広い"],"r":["ひろい"]},{"k":["多い","少ない"],"r":["おおい","すくない"]},{"k":["少し"],"r":["すこし"]},{"k":["長い","短い"],"r":["ながい","みじかい"]},{"k":["悪い"],"r":["わるい"]},{"k":["重い","軽い"],"r":["おもい","かるい"]},{"k":["早い","早く"],"r":["はやい","はやく"]},{"k":["強い"],"r":["つよい"]}],"14":[{"k":["便利な"],"r":["べんりな"]},{"k":["元気な"],"r":["げんきな"]},{"k":["電気"],"r":["でんき"]},{"k":["親切な"],"r":["しんせつな"]},{"k":["出かけます"],"r":["でかけます"]},{"k":["有名な"],"r":["ゆうめいな"]},{"k":["名前"],"r":["なまえ"]},{"k":["地下鉄"],"r":["ちかてつ"]},{"k":["仕事"],"r":["しごと"]},{"k":["見せます"],"r":["みせます"]}],"15":[{"k":["東","東京"],"r":["ひがし","とうきょう"]},{"k":["西"],"r":["にし"]},{"k":["南"],"r":["みなみ"]},{"k":["北"],"r":["きた"]},{"k":["夜"],"r":["よる"]},{"k":["入れます"],"r":["いれます"]},{"k":["お金を下ろします"],"r":["おかねを おろします"]},{"k":["料理"],"r":["りょうり"]},{"k":["口"],"r":["くち"]},{"k":["目"],"r":["め"]},{"k":["足"],"r":["あし"]},{"k":["出します"],"r":["だします"]},{"k":["休みの日"],"r":["やすみの ひ"]}],"16":[{"k":["雨が降ります"],"r":["あめが ふります"]},{"k":["電車を降ります"],"r":["でんしゃを おります"]},{"k":["思います"],"r":["おもいます"]},{"k":["寝ます"],"r":["ねます"]},{"k":["終わります"],"r":["おわります"]},{"k":["言います"],"r":["いいます"]},{"k":["話","話します"],"r":["はなし","はなします"]},{"k":["知っています","知りません"],"r":["しっています","しりません"]},{"k":["同じ"],"r":["おなじ"]},{"k":["漢字"],"r":["かんじ"]},{"k":["あの方","使い方"],"r":["あのかた","つかいかた"]}],"17":[{"k":["図書館"],"r":["としょかん"]},{"k":["地図"],"r":["ちず"]},{"k":["銀行"],"r":["ぎんこう"]},{"k":["大きい町"],"r":["おおきいまち"]},{"k":["住んでいます"],"r":["すんでいます"]},{"k":["一度"],"r":["いちど"]},{"k":["近い"],"r":["ちかい"]},{"k":["生まれます"],"r":["うまれます"]},{"k":["服を着ます"],"r":["ふくを きます"]},{"k":["着物","上着","下着"],"r":["きもの","うわぎ","したぎ"]},{"k":["音楽"],"r":["おんがく"]},{"k":["楽しい"],"r":["たのしい"]},{"k":["持ちます"],"r":["もちます"]},{"k":["持っています"],"r":["もっています"]}],"18":[{"k":["春"],"r":["はる"]},{"k":["夏"],"r":["なつ"]},{"k":["秋"],"r":["あき"]},{"k":["冬"],"r":["ふゆ"]},{"k":["道"],"r":["みち"]},{"k":["食堂"],"r":["しょくどう"]},{"k":["建物"],"r":["たてもの"]},{"k":["病気"],"r":["びょうき"]},{"k":["病院"],"r":["びょういん"]},{"k":["体"],"r":["からだ"]},{"k":["運転"],"r":["うんてん"]},{"k":["乗ります"],"r":["のります"]}],"19":[{"k":["家"],"r":["いえ"]},{"k":["家内","奥さん"],"r":["かない","おくさん"]},{"k":["家族"],"r":["かぞく"]},{"k":["兄","お兄さん"],"r":["あに","おにいさん"]},{"k":["弟","弟さん"],"r":["おとうと","おとうとさん"]},{"k":["兄弟"],"r":["きょうだい"]},{"k":["姉","お姉さん"],"r":["あね","おねえさん"]},{"k":["妹","妹さん"],"r":["いもうと","いもうとさん"]},{"k":["海"],"r":["うみ"]},{"k":["時計"],"r":["とけい"]},{"k":["音"],"r":["おと"]},{"k":["買い物"],"r":["かいもの"]}],"20":[{"k":["部屋"],"r":["へや"]},{"k":["教室"],"r":["きょうしつ"]},{"k":["窓"],"r":["まど"]},{"k":["本屋"],"r":["ほんや"]},{"k":["開けます","閉めます"],"r":["あけます","しめます"]},{"k":["歩きます"],"r":["あるきます"]},{"k":["着きます"],"r":["つきます"]},{"k":["歌を歌います"],"r":["うたを うたいます"]},{"k":["意味"],"r":["いみ"]},{"k":["天気"],"r":["てんき"]},{"k":["考えます"],"r":["かんがえます"]},{"k":["山へ行きます"],"r":["やまへ いきます"]},{"k":["川の水"],"r":["かわのみず"]},{"k":["自分で"],"r":["じぶんで"]}]};
const app=document.getElementById('app');
const $=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){k==='class'?e.className=a[k]:k.startsWith('on')?e.addEventListener(k.slice(2),a[k]):e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x));return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let shuf=false,S=null;
const KEY='kanji-tango-known';
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...known]))}catch(e){}};
const cid=(u,it)=>u+':'+it.k.join('|');
const left=u=>DATA[u].filter(it=>!known.has(cid(u,it)));

function home(){
  S=null;app.replaceChildren(
    $('header',{},$('h1',{},'漢字読み方単語帳'),$('p',{class:'sub'},'ユニットを選んでください。漢字を見て、読み方を思い出してから答えを確認します。')),
    $('label',{class:'opt',for:'shuf'},$('input',{type:'checkbox',id:'shuf',...(shuf?{checked:''}:{}),onchange:e=>shuf=e.target.checked}),'順番をシャッフルする'),
    $('div',{class:'grid'},Object.keys(DATA).sort((a,b)=>a-b).map(u=>
      {const r=left(u).length,n=DATA[u].length;
        return $('button',{class:'unit'+(r?'':' fin'),onclick:()=>start(u)},$('span',{class:'l'},'ユニット'),$('span',{class:'n'},u),
          $('span',{class:'c'},r?(r===n?`${n} 語`:`残り ${r} / ${n} 語`):'完了・復習する'))})),
    known.size?(()=>{const b=$('button',{class:'reset',onclick:()=>{if(b.classList.contains('arm')){known=new Set();save();home()}else{b.classList.add('arm');b.textContent='もう一度押すと覚えた記録を全て消します'}}},'覚えた記録をリセット');return b})():'');
}
function start(u,items,all){
  let base=all?DATA[u].slice():left(u);if(!base.length)base=DATA[u].slice();
  const list=items||(shuf?shuffle(base):base);
  S={u,list,i:0,open:false,again:[],good:0};render();
}
function render(){
  if(!S)return;
  if(S.i>=S.list.length)return finish();
  const it=S.list[S.i];
  const card=$('div',{class:'card'+(S.open?' open':''),tabindex:'0',role:'button','aria-label':'タップして読み方を表示',onclick:()=>{if(!S.open)reveal()}},
    it.k.map((k,j)=>$('div',{class:'w'},$('div',{class:'k'},k),$('div',{class:'r'},it.r[j]))),
    $('p',{class:'hint'},'タップして読み方を見る'));
  app.replaceChildren(
    $('div',{class:'top'},$('button',{class:'back',onclick:home},'← ユニット選択'),$('span',{class:'count'},`ユニット${S.u}　${S.i+1} / ${S.list.length}`)),
    $('div',{class:'bar'},$('i',{style:`width:${S.i/S.list.length*100}%`})),
    card,
    S.open?$('div',{class:'actions'},$('button',{class:'btn again',onclick:()=>next(false)},'もう一度'),$('button',{class:'btn good',onclick:()=>next(true)},'覚えた')):
           $('div',{class:'actions'},$('button',{class:'btn main',onclick:reveal},'読み方を見る')));
}
function reveal(){S.open=true;render();}
function next(ok){const it=S.list[S.i];if(ok){S.good++;known.add(cid(S.u,it));save()}else S.again.push(it);S.i++;S.open=false;render();}
function finish(){
  const n=S.list.length,a=S.again.slice(),u=S.u;
  app.replaceChildren($('div',{class:'top'},$('button',{class:'back',onclick:home},'← ユニット選択'),$('span',{class:'count'},`ユニット${u}`)),
    $('div',{class:'bar'},$('i',{style:'width:100%'})),
    $('div',{class:'done'},$('p',{class:'sub'},'おつかれさまでした'),$('div',{},$('b',{},S.good),$('span',{class:'sub'},` / ${n} 語　覚えた`)),
      $('div',{class:'row'},
        a.length?$('button',{class:'btn main',onclick:()=>start(u,shuffle(a))},`もう一度の ${a.length} 語を復習`):'',
        $('button',{class:'btn',onclick:()=>start(u,null,true)},'ユニット全体を最初から（覚えた語も含む）'))));
}
document.addEventListener('keydown',e=>{
  if(!S||S.i>=S.list.length||e.target.tagName==='BUTTON'&&e.key==='Enter')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();S.open?next(true):reveal()}
  else if(S.open&&e.key==='ArrowLeft')next(false);
  else if(S.open&&e.key==='ArrowRight')next(true);
});
home();
</script>

</body>
</html>
